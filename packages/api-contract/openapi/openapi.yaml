openapi: 3.1.0
info:
  title: Keys API
  version: 1.0.0
  description: Read access to pull request data.
tags: []
paths:
  /pull-requests:
    get:
      operationId: listPullRequests
      summary: List pull requests
      description: Returns a cursor-paginated list of pull requests, newest first.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous response's `nextCursor`.
          schema:
            type: string
          explode: false
        - name: limit
          in: query
          required: false
          description: Maximum number of items to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestPage'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
        message:
          type: string
          description: Human-readable description of what went wrong.
      description: An error returned by the API.
    Author:
      type: object
      required:
        - login
        - avatarUrl
      properties:
        login:
          type: string
          description: The account's login handle.
        avatarUrl:
          type: string
          format: uri
          description: URL of the account's avatar image.
      description: The GitHub account that opened a pull request.
    PullRequest:
      type: object
      required:
        - id
        - number
        - title
        - state
        - draft
        - author
        - repository
        - url
        - createdAt
        - updatedAt
        - mergedAt
      properties:
        id:
          type: string
          description: Stable identifier for the pull request.
        number:
          type: integer
          format: int32
          description: The number shown in the GitHub UI, unique within a repository.
        title:
          type: string
          description: The pull request title.
        state:
          $ref: '#/components/schemas/PullRequestState'
        draft:
          type: boolean
          description: Whether the pull request is still a draft.
        author:
          $ref: '#/components/schemas/Author'
        repository:
          $ref: '#/components/schemas/Repository'
        url:
          type: string
          format: uri
          description: Web URL of the pull request.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        mergedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: When the pull request was merged, or null if it never was.
      description: A GitHub pull request.
    PullRequestPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PullRequest'
          description: The items in this page, ordered newest first.
        nextCursor:
          anyOf:
            - type: string
            - type: 'null'
          description: Cursor to pass as `cursor` to fetch the next page. Null on the last page.
      description: A single page of results, addressed by an opaque cursor.
    PullRequestState:
      type: string
      enum:
        - open
        - closed
        - merged
      description: The lifecycle state of a pull request.
    Repository:
      type: object
      required:
        - owner
        - name
      properties:
        owner:
          type: string
          description: The account or organisation that owns the repository.
        name:
          type: string
          description: The repository name, without the owner prefix.
      description: The repository a pull request belongs to.
