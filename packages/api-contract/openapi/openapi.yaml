openapi: 3.1.0
info:
  title: Keys API
  version: 1.0.0
  description: Read access to pull request data.
tags: []
paths:
  /pull-requests:
    get:
      operationId: listPullRequests
      summary: List pull requests
      description: Returns a cursor-paginated list of pull requests, newest first.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous response's `nextCursor`.
          schema:
            type: string
          explode: false
        - name: state
          in: query
          required: false
          description: Filter by pull request state. Defaults to `all`.
          schema:
            type: string
            enum:
              - open
              - closed
              - all
            default: all
          explode: false
        - name: limit
          in: query
          required: false
          description: Maximum number of items to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestPage'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable description of what went wrong.
      description: An error returned by the API.
    Author:
      type: object
      required:
        - username
        - profileImage
      properties:
        username:
          type: string
          description: The account's username.
        profileImage:
          type: string
          format: uri
          description: URL of the account's avatar image.
      description: The account that opened a pull request.
    PullRequest:
      type: object
      required:
        - id
        - title
        - state
        - author
        - repository
        - url
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Identifier for the pull request.
        title:
          type: string
          description: The pull request title.
        state:
          type: string
          enum:
            - open
            - closed
          description: The lifecycle state of a pull request.
        author:
          $ref: '#/components/schemas/Author'
        repository:
          $ref: '#/components/schemas/Repository'
        url:
          type: string
          format: uri
          description: URL of the pull request.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: A pull request.
    PullRequestPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PullRequest'
          description: The items in this page, ordered newest first.
        nextCursor:
          anyOf:
            - type: string
            - type: 'null'
          description: Cursor to pass as `cursor` to fetch the next page. Null on the last page.
      description: A single page of results, addressed by an opaque cursor.
    Repository:
      type: object
      required:
        - owner
        - name
      properties:
        owner:
          type: string
          description: The account or organisation that owns the repository.
        name:
          type: string
          description: The repository name, without the owner prefix.
      description: The repository a pull request belongs to.
